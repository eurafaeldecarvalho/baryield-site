# GitHub Pages is served from the gh-pages branch (the API token could not
# enable Pages on main). This keeps gh-pages identical to main on every push.
name: sync-gh-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
